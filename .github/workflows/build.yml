name: build

# PUBLIC-ONLY PUBLISHING GATE
# On a PRIVATE repo, CI still runs the full pipeline (host logic tests + the esp32s3 firmware build
# + artifact upload) but publishes NOTHING outward: no git tags, no GitHub Releases, no GitHub Pages
# (neither the root installer site nor per-PR previews). Every such step is gated on
# `github.event.repository.private == false`, evaluated per run — so flipping the repo to PUBLIC
# re-enables them with no edit to this file. NOTE: a visibility change does not itself trigger a
# run. The first publish needs one `workflow_dispatch` (or a firmware-relevant push), and that run
# is what CREATES the gh-pages branch the Pages source must then be pointed at — see docs/README.md
# ("Bringing the site up the first time"). Until a v* tag exists the firmware version stays at the
# version.txt floor (1.0.0).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # manual re-publish of the Pages site at the latest released version (public only)

# Serialize main so the auto-incremented release version can't race; cancel superseded PR runs.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Fast, hardware-free gate: host-side pure-logic tests (main/logic/) before the slow esp32s3
  # firmware build, so a decode/config/discovery regression fails in seconds. See test/README.md.
  logic-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run host-side logic tests
        run: ./scripts/run-mock-tests.sh

  # Domain-correctness gate: are the published values physically RIGHT? The logic tests above
  # verify the logic they are handed; they cannot see a well-formed value that is simply false —
  # a wrong converter compiles, passes them all, and publishes -971.5 °C to Home Assistant
  # (issues #35-#39). This runs the real converters over the real catalog against docs/REGISTERS.md.
  # Hardware-free and seconds long, so it gates the build like logic-test does. The human half of
  # the gate is the /domain-review skill + its PR checkbox; this is the mechanical half.
  domain-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Audit the value catalog
        run: ./scripts/run-domain-audit.sh
      # A checker that has stopped checking turns "clean" from evidence into a lie, so the audit
      # must keep catching the four decode bugs it was built for (re-introduced into a throwaway
      # copy; the tree is never touched).
      - name: Verify the audit still has teeth
        run: ./tools/domain/selftest.sh

  build:
    needs: [logic-test, domain-audit]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # tags + releases + the gh-pages branch push (the only Pages publisher)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history + tags for versioning / change detection

      - name: Compute release version
        id: version
        run: |
          git fetch --tags --force
          next="$(./scripts/next-version.sh)"
          latest="$(git tag -l 'v*' --sort=-v:refname | head -n1 | sed 's/^v//')"
          echo "version=$next"  >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Detect firmware-relevant changes
        id: changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            changed=yes
          elif git diff --name-only "$before" "${{ github.sha }}" \
               | grep -qE '^(main/|CMakeLists\.txt$|sdkconfig\.defaults$|partitions\.csv$|version\.txt$|\.github/workflows/build\.yml$|scripts/ci-build-all\.sh$|scripts/build-pages\.sh$)'; then
            changed=yes
          else
            changed=no
          fi
          echo "firmware=$changed" >> "$GITHUB_OUTPUT"

      # Stamp the embedded firmware version (esp_app_get_description()->version) so the running
      # image, the release tag and the manifest can never drift. version.txt is the committed
      # FLOOR; here we overwrite it in the workspace (NOT committed) with what we publish.
      - name: Stamp firmware version
        id: stamp
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ steps.version.outputs.latest }}"; [ -z "$base" ] && base="${{ steps.version.outputs.version }}"
            disp="${base}-PR-${{ github.event.pull_request.number }}"
          elif [ "${{ steps.changes.outputs.firmware }}" = "yes" ]; then
            disp="${{ steps.version.outputs.version }}"
          else
            disp="${{ steps.version.outputs.latest }}"; [ -z "$disp" ] && disp="${{ steps.version.outputs.version }}"
          fi
          echo "$disp" > version.txt
          echo "disp=$disp" >> "$GITHUB_OUTPUT"

      # Materialize the offline OTA signing key from the OTA_SIGNING_KEY secret (RSA-3072 PEM).
      # Main publish w/o secret -> hard error (never publish unsigned to OTA). Fork PR w/o secret
      # -> warn + build unsigned (compile check only, no preview). See docs/SECURITY.md.
      - name: Provision OTA signing key
        id: signkey
        if: >-
          ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main')
          || github.event_name == 'pull_request'
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          if [ -z "$OTA_SIGNING_KEY" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "signed=false" >> "$GITHUB_OUTPUT"
              echo "::warning::No OTA_SIGNING_KEY (fork PR?) — building UNSIGNED; no PR preview published."
              exit 0
            fi
            echo "::error::Refusing to publish UNSIGNED firmware — set the OTA_SIGNING_KEY secret (docs/SECURITY.md)." >&2
            exit 1
          fi
          printf '%s\n' "$OTA_SIGNING_KEY" > ota_signing_key.pem
          chmod 600 ota_signing_key.pem
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5 # v1.2.0
        with:
          esp_idf_version: v6.0.2
          target: esp32s3
          # ci-build-all.sh builds esp32s3 target and stages signed + merged bins + manifest.json
          # into dist/. OTA pulls daikin-altherma-esp32.bin.
          #
          # Pass the STAMPED version (what version.txt above put into the image), never the next
          # release version: OTA compares the manifest version to the version the running app
          # reports, so publishing a manifest the bins don't embed makes every device download an
          # "update" that changes nothing, forever. They differ on exactly the triggers that don't
          # cut a release (docs-only push, workflow_dispatch, PR). ci-build-all.sh reads the
          # version back out of the built image and fails if the two ever drift apart again.
          command: ./scripts/ci-build-all.sh "${{ steps.stamp.outputs.disp }}"

      - name: Shred OTA signing key
        if: always()
        run: rm -f ota_signing_key.pem

      # Upload the bins AND the unstripped .elf (+ checksum): the .elf is the only artifact that can
      # symbolize a core dump from this build (scripts/decode-coredump.sh), so retaining it per
      # version/PR keeps every build's crashes decodable — even while the repo is private and cuts no
      # public Release. Artifact retention (default 90 days) is the archive.
      # Named after the STAMPED version (disp), not the next release version: this artifact is how
      # a core dump finds its .elf, and a dump reports the version the image embeds. On a PR that
      # is "<base>-PR-<N>", so PR builds stay self-labelling without a separate name shape.
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: daikin-altherma-esp32-${{ steps.stamp.outputs.disp }}
          path: |
            dist/*.bin
            dist/*.elf
            dist/*.elf.sha256

      # PR preview installer (signed builds only) at gh-pages PR/<N>/. Public repos only.
      - name: Assemble PR preview site
        if: github.event_name == 'pull_request' && steps.signkey.outputs.signed == 'true' && github.event.repository.private == false
        run: ./scripts/build-pages.sh "${{ github.event.pull_request.number }}"
      - name: Publish PR preview to gh-pages
        if: github.event_name == 'pull_request' && steps.signkey.outputs.signed == 'true' && github.event.repository.private == false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/publish-pages-branch.sh --pr "${{ github.event.pull_request.number }}"

      # Cut a release only when firmware-relevant files changed. Public repos only (creates a v* tag).
      - name: Create release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.changes.outputs.firmware == 'yes' && github.event.repository.private == false
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          # Attach the .elf (+ checksum) alongside the bins so a user's core dump can be decoded
          # against the exact released firmware (scripts/decode-coredump.sh).
          files: |
            dist/*.bin
            dist/*.elf
            dist/*.elf.sha256

      # The gh-pages BRANCH is the single publisher — the repo's Pages source must be set to
      # "Deploy from a branch: gh-pages / (root)" (docs/README.md). The Actions-deployment path
      # (configure-pages -> upload-pages-artifact -> deploy-pages) is deliberately NOT used: it
      # deploys one atomic whole-site artifact, which cannot host the per-PR preview subpaths
      # (PR/<N>/) that build-pages.sh + pr-preview-cleanup.yml maintain. The two mechanisms are
      # mutually exclusive — a repo's Pages source is either a branch or Actions, so running both
      # meant one of them was always dead or failing.
      - name: Assemble Pages site
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.event.repository.private == false
        run: ./scripts/build-pages.sh
      - name: Publish site to gh-pages (root)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.event.repository.private == false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/publish-pages-branch.sh
