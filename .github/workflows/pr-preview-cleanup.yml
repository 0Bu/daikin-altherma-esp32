name: pr-preview-cleanup

# When a PR closes (merged or not), delete its per-PR firmware preview from gh-pages (PR/<N>/)
# so stale builds don't linger on the installer site. Only same-repo PRs ever published a
# preview (fork PRs can't sign/push), so fork closes are skipped.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write

concurrency:
  group: gh-pages-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cleanup:
    # Gated on public: while the repo is private no PR preview is ever published (see build.yml),
    # so there is nothing to clean and no gh-pages branch should be touched. Re-enables on public.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.ref }}
      - name: Remove PR preview from gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/publish-pages-branch.sh --rm "${{ github.event.pull_request.number }}"
