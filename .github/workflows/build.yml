name: build

# RELEASE MANAGEMENT — a merge does NOT cut a release
#
# There are two published feeds, cut by two different events:
#
#   RELEASE  (gh-pages root, /manifest.json)      only a MANUAL run of this workflow with
#                                                 `release: true` tags v* and republishes it
#   DEV      (gh-pages dev/,  /dev/manifest.json) every firmware-relevant push to main
#
# Before this split, every firmware-relevant merge auto-tagged a release, so the version number
# moved with the branch and "the latest release" meant "whatever was merged last" — there was no
# such thing as a build that had been deliberately cut, and no way to run one. Now `main` moves
# freely on the dev feed and a release is an act: Actions -> build -> Run workflow -> release: true,
# picking the bump level. The device chooses which feed it follows (Settings -> ESP32 -> Update
# channel, POST /set_ota); each slice published by this workflow has the same shape, so nothing
# downstream is special-cased. A root slice from an older release stays in its historical shape
# until the next manual release; a dev push never rewrites it.
#
# PUBLISHING POLICY — publishes from a PRIVATE repo too, and the Pages site is PUBLIC
#
# This pipeline used to gate every outward publish on `github.event.repository.private == false`.
# That gate is GONE on purpose: GitHub Pro can serve Pages from a private repository, and this
# project wants the browser installer + the OTA feed live before the source goes public.
#
# Be clear about what that means, because the two halves differ:
#   • GitHub Pages (the root installer site and the dev channel) is PUBLIC —
#     readable by anyone on the internet, regardless of repo visibility. Making a Pages site
#     access-controlled needs an ORGANIZATION on GitHub Enterprise Cloud; it is not available to a
#     user account on Pro. So the signed firmware, browser-installer parts, manual merged image and
#     manifest.json and artifacts.json are world-downloadable while the SOURCE stays private. That is an accepted trade,
#     not an oversight.
#   • Git tags + GitHub Releases are NOT public on a private repo — only accounts with repo read
#     access see them. They are un-gated anyway because they are what makes the OTA release feed
#     WORK: the release step below is the only thing that creates a v* tag, next-version.sh derives
#     the next version from the latest tag, and with no tags it returns the version.txt floor
#     forever. Ungating Pages while leaving releases gated would publish a manifest pinned at 1.0.0
#     for all time — a feed that is live but frozen, where every device reports "up to date".
#
# NOTE: bootstrap gh-pages once as a reviewed, signed orphan commit BEFORE the first publish. The
# GraphQL publisher deliberately refuses to invent a branch: every later commit is GitHub-signed,
# but createCommitOnBranch can only append to an existing branch. Then point Pages at gh-pages /
# (root) and use workflow_dispatch (or a firmware-relevant push), see docs/README.md. Until a v*
# tag exists the version stays at the version.txt floor (1.0.0) and only the dev feed moves.

# CI BUDGET — this pipeline runs on a metered minute allowance, so every job is shaped by it
#
# Actions bills each JOB rounded UP to the next whole minute, on top of the wall-clock time it
# actually spends. Three 15-second test jobs therefore cost the same three minutes as three
# one-minute ones, which is why the fast hardware-free tests remain ONE `mechanical_gates` job.
# The separate `pr-policy.yml` workflow supplies the required protected-base `gates` check without
# ever loading PR code. The rules that follow from that, all applied here:
#
#   • one mechanical job, not three       — 3 billed minutes -> 1
#   • one isolated PR policy job          — explicit cost in pr-policy.yml for a trusted exception
#   • the ~5 min firmware build is SKIPPED when nothing it consumes changed (the gate output),
#     on pull requests as well as on pushes — a docs-only PR used to pay a full build to prove
#     that prose still compiles
#   • ccache across runs (restored everywhere, saved from main) — the compile is ~3 of the build
#     job's ~5 minutes and starts cold every time, since `idf.py set-target` wipes the build dir.
#     Keyed on the TOOLCHAIN + sdkconfig + dependency lock, never on this file's hash: editing the
#     workflow (a comment included) must not throw away a cache nothing in it invalidated
#   • NO per-PR preview installer. Publishing one per PR commit meant a gh-pages push per commit,
#     and every gh-pages push starts GitHub's own three-job "pages build and deployment" run on
#     top of this one. The DEV CHANNEL covers the same need — flash what is on main from a
#     browser — at one publish per merge
#   • `timeout-minutes` on every job — a wedged runner must not be able to spend six hours of the
#     monthly allowance before anyone notices
#
# The required PR `build` job always carries the mechanical result and conditions only its compile
# steps. Do not replace that with workflow-level `paths-ignore:`, which would leave a required check
# pending forever on a docs-only PR. Trusted main builds may still skip as whole jobs.

on:
  push:
    branches: [main]
  # Fork pull-request code is executed only under this event, so GitHub withholds repository secrets
  # and downgrades its token. Same-repository branch authors remain trusted CI actors: they can edit
  # this workflow and request repository secrets before any merge gate runs. The separate
  # pr-policy.yml workflow alone uses pull_request_target and never checks out PR code.
  pull_request:
    branches: [main]
    # `edited` is required because title/body changes do not move the head SHA, but the hygiene gate
    # below must replace the prior green check with a result for the current PR text.
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      release:
        description: "Cut a RELEASE (tag v*, GitHub Release, publish the release channel)"
        type: boolean
        default: false
      bump:
        description: "Which version segment the release bumps (ignored unless release is checked)"
        type: choice
        options: [patch, minor, major]
        default: patch
      release_version:
        description: "Exact X.Y.Z to resume a partial release (blank derives the next version)"
        type: string
        required: false
        default: ""

# Serialize main so the release version + the two feeds can't race; cancel superseded PR runs.
# A release dispatch and a push to main share this group deliberately: they both derive a version
# from the tag list, and a release must never be computed against a tag another run is creating.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  # ALL fast, hardware-free mechanical gates stay in ONE job ahead of the slow firmware build, so a
  # decode/config/discovery/publish regression fails in seconds. They were three jobs (logic-test,
  # domain-audit, pages-publish-test) and are three STEPS now — a step boundary reports a failure
  # just as precisely as a job boundary does, while a job boundary also costs a rounded-up billed
  # minute for ~15 seconds of work, three checkouts and three runner starts.
  #
  # NOTE for branch protection: the required checks are now `gates` and `build`, not the three
  # old job names.
  mechanical_gates:
    # A release is an explicit maintainer publication action for an already accepted main commit.
    # PR/main CI owns testing; do not rerun or make those tests a prerequisite for tagging it.
    if: github.event_name != 'workflow_dispatch' || inputs.release != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      firmware: ${{ steps.changes.outputs.firmware }}
    steps:
      - name: Check out tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bind tested merge tree to the reviewed head
        if: github.event_name == 'pull_request'
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          tested_base="$(git rev-parse HEAD^1)"
          tested_head="$(git rev-parse HEAD^2)"
          # The HEAD binding is exact and stays exact: it is what stops CI from attesting a tree
          # the reviewer never saw, and every review stamp names this SHA.
          [ "$tested_head" = "$EVENT_HEAD_SHA" ] \
            || { echo "tested merge tree uses $tested_head, expected $EVENT_HEAD_SHA" >&2; exit 2; }
          # The BASE binding cannot be exact. `pull_request.base.sha` is the base tip from when the
          # PR was opened and never moves again — a synchronize does not refresh it — while
          # refs/pull/N/merge is recomputed against the LIVE base. An equality check therefore held
          # only until `main` moved under an open PR, which CONTRIBUTING.md says out loud that it
          # does ("main moves under open PRs — expect to rebase before merge"), and no rebase can
          # clear it: the stale value is on the PR object, not on the branch. The real invariant is
          # weaker and is what this asserts — the tested tree merged the reviewed head onto a commit
          # that is ON the base branch and no older than the reviewed base.
          base_tip="$(git rev-parse --verify -q "refs/remotes/origin/$BASE_REF" || true)"
          if [ -z "$base_tip" ]; then
            git fetch --no-tags --quiet origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" || true
            base_tip="$(git rev-parse --verify -q "refs/remotes/origin/$BASE_REF" || true)"
          fi
          [ -n "$base_tip" ] \
            || { echo "cannot resolve the tip of base branch $BASE_REF" >&2; exit 2; }
          git merge-base --is-ancestor "$tested_base" "$base_tip" \
            || { echo "tested merge tree base $tested_base is not on $BASE_REF" >&2; exit 2; }
          git merge-base --is-ancestor "$EVENT_BASE_SHA" "$tested_base" \
            || { echo "tested merge tree base $tested_base predates the reviewed base $EVENT_BASE_SHA" >&2; exit 2; }

      # Which MUTATION SELF-TESTS ("still has teeth") this diff can actually affect.
      #
      # These prove a gate can still FAIL, so on a PR that cannot reach one of them it re-proves an
      # unchanged fact. Measured on one real PR they were 125 s of a 267 s job — 47 % of every PR's
      # mechanical CI spent testing the gates rather than the firmware, with
      # tools/agent-hooks/selftest.sh alone at 62 s, the slowest step in the whole pipeline.
      #
      # Only the NINE self-tests costing >= 4 s are gated: they are 116 s of that 125 s, so the
      # remaining nine (9 s together) stay unconditional rather than buy 7 % for twice the
      # conditionals.
      #
      # EACH PATTERN BELOW IS ITS SELF-TEST'S INPUT SURFACE — the tree paths that self-test reads or
      # copies — never the subject its gate is merely named after. Most of them do NOT seed a
      # self-contained fixture: tools/absence/selftest.sh copies main/, test/, tools/ and
      # sdkconfig.defaults and then re-introduces defects by exact string, asserting
      # `seed 1 did not apply — the call site moved` when main/hp_poll.cpp has moved on;
      # tools/agent-config/selftest.sh drives scripts/run-agent-instructions-budget.sh itself;
      # tools/esp_idf_matrix/selftest.py reads main/CMakeLists.txt, partitions.csv and
      # sdkconfig.defaults. A mapping drawn from tool ownership instead would skip a self-test on
      # exactly the diff that can break it — including the one diff shape that matters most, an edit
      # to the gate script whose canary is the only thing proving it can still fail.
      #
      # Verdicts still never key on the audited DATA: a defect seeded into a throwaway copy is what
      # each self-test judges, so audited content changes which files it must run for, not what it
      # concludes.
      #
      # Fail-open by construction: anything other than an ordinary pull_request, an unresolvable
      # diff, or a change to this workflow runs the complete set. A push to main therefore always
      # re-proves every gate, which is the backstop if a path mapping here is ever too narrow.
      - name: Scope the mutation self-tests to the tooling this diff touches
        id: scope
        run: |
          set -euo pipefail
          all=no
          if [ "${{ github.event_name }}" = pull_request ]; then
            # HEAD is the merge ref, so HEAD^1 is the base tip: exactly this PR's diff.
            git diff --name-only HEAD^1 HEAD > /tmp/meta-changed.txt || all=yes
          else
            all=yes
          fi
          # Materialise before grepping, never `git diff | grep -q`: under pipefail grep -q exits at
          # the first match, git diff dies of SIGPIPE, and a long changed-file list with an early
          # match would take the wrong branch (see "Detect build-relevant changes" below).
          if [ "$all" = no ] && grep -qE '^\.github/workflows/build\.yml$' /tmp/meta-changed.txt; then
            all=yes   # the gating logic itself changed — re-prove everything
          fi
          emit() {
            if [ "$all" = yes ] || grep -qE "$2" /tmp/meta-changed.txt; then value=yes; else value=no; fi
            echo "$1=$value" >> "$GITHUB_OUTPUT"
            echo "  $1=$value"
          }
          echo "mutation self-test scope (all=$all):"
          # agent-hooks drives the merge gate, which runs the UI, absence and UI-GIF suites; its
          # formatter cases copy the real .clang-format, and it pins the exact command shapes of
          # gh-with-git-credentials.sh and production-ota-gate.py.
          emit agent_hooks '^(tools/(agent-hooks|agent-policy|absence|ui|uigif)/|\.codex/hooks\.json$|\.clang-format$|\.github/pull_request_template\.md$|scripts/(run-(agent-policy|ui-use-case-tests|ui-gif-audit)|gh-with-git-credentials|production-ota-gate)\.(sh|py)$)'
          # agent-config's canaries run scripts/run-agent-instructions-budget.sh over a fixture built
          # from .agents/, .codex/, AGENTS.md and .mcp.json.
          emit agent_config '^(tools/agent-config/|\.codex/|\.agents/|AGENTS\.md$|\.mcp\.json$|scripts/(gh-with-git-credentials|run-agent-instructions-budget)\.sh$)'
          # agent-policy drives require-pr-gates.sh and reads both Renovate records.
          emit agent_policy '^(tools/agent-policy/|tools/agent-hooks/require-pr-gates\.sh$|\.github/(workflows/(pr-policy|renovate)\.ya?ml|renovate\.json)$|scripts/(run-agent-policy|gh-with-git-credentials)\.sh$)'
          # the domain canaries compile catalog_audit.cpp against main/logic and test/test_logic.cpp.
          emit domain '^(tools/domain/|scripts/run-domain-audit\.sh$|main/(def|logic)/|test/test_logic\.cpp$|docs/REGISTERS\.md$)'
          # absence copies main/, test/, tools/ and sdkconfig.defaults, then seeds by exact string.
          emit absence '^(tools/|main/|test/|sdkconfig\.defaults$|scripts/run-browser-render-tests\.sh$)'
          emit presenter '^(tools/(presenter|ui)/|scripts/check-presenter-parity\.sh$|test/presenter_golden_dump\.cpp$|main/(www|logic|def)/)'
          # uigif's section-7 cases copy the merge-gate stack into a fixture and RUN it — proving a
          # stale recording still blocks merge past a current human $ui-gif stamp, and that the MCP
          # merge path cannot bypass the REST-only gate — so that stack is part of its input surface.
          emit uigif '^(tools/(uigif|ui)/|scripts/(run-ui-gif-audit|record-dashboard-gif|gh-with-git-credentials)\.sh$|docs/media/|main/www/|README\.md$|tools/agent-hooks/(require-pr-gates|pr-gate-lib)\.sh$|tools/agent-hooks/(merge_payload|run_with_timeout)\.py$|tools/agent-policy/extract_changed_files\.py$)'
          emit schematic '^(tools/schematic/|scripts/run-schematic-audit\.sh$|main/(www|def)/|docs/DESIGN\.md$)'
          emit esp_idf_matrix '^(tools/esp_idf_matrix/|scripts/run-esp-idf-matrix-audit\.sh$|main/|partitions\.csv$|sdkconfig\.defaults$|docs/ESP_IDF_MATRIX\.md$)'

      # Contributor-authored text: does the commit range this PR carries, or its title/description,
      # hold personal information (an email outside GitHub's own noreply/example patterns, a phone
      # number, a GPS coordinate pair, a pasted key or credential) or high-confidence German prose?
      # Runs here, right after the merge-tree binding above, and receives those exact event SHAs;
      # every other gate below needs only the checked-out tree and stays unconditional.
      # Diff/firmware content is deliberately NOT in scope; tools/pr_hygiene/personal_info.mjs
      # explains why a value-shaped heuristic cannot safely run over this codebase's diffs. PR-only:
      # a push to main has already passed this as a PR, and there is no title/description to re-check.
      - name: Audit commit and PR-text privacy and language
        if: github.event_name == 'pull_request'
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/run-pr-hygiene-audit.sh --base "$EVENT_BASE_SHA" --head "$EVENT_HEAD_SHA"
      - name: Verify the PR-hygiene audit still has teeth
        run: ./tools/pr_hygiene/selftest.sh

      # Host-side pure-logic tests (main/logic/) plus an aggregate executable-line floor. This is
      # deliberately coverage of the production headers only: counting the 6k-line test driver
      # would let new assertions make the percentage greener without exercising another branch.
      - name: Run host-side logic tests with coverage
        run: ./scripts/run-mock-tests.sh --coverage
      - name: Verify the logic coverage gate still has teeth
        run: ./tools/coverage/selftest.sh

      # Hostile-input properties run under ASan+UBSan with deterministic seeds. This is bounded
      # fuzzing rather than an unending campaign, so every CI run repeats the exact parser,
      # framing and state-machine corpus and reports a reproducible failing input.
      - name: Run sanitizer-backed hostile-input properties
        run: ./scripts/run-sanitizer-fuzz-tests.sh

      # Execute production pure headers behind fake clocks, NVS/allocator failpoints and fragmented
      # transports, plus real POSIX slow-header/body socket reads interrupted by shutdown at an
      # absolute deadline. This is the deterministic Device-Glue seam between isolated logic CHECKs
      # and real HIL: NVS atomicity, OOM survival, task interleavings, X10A/Modbus/MQTT and bounded
      # HTTP behavior are exercised together. Production HTTP/MCP glue remains outside this host
      # seam; atomicity and both socket-deadline mutations prove the harness itself can fail.
      - name: Run runtime and transport integration harness
        run: ./scripts/run-runtime-integration-tests.sh

      # Check only new files and changed C/C++ hunks with the exact formatter used by CI. Existing
      # legacy drift outside the diff is not rewritten; portable whitespace/encoding invariants
      # remain whole-tree checks. Both layers are fail-closed and have mutation self-tests.
      - name: Install pinned C/C++ formatter
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18
      - name: Check source formatting invariants
        env:
          CLANG_FORMAT: clang-format-18
        run: ./scripts/run-format-check.sh
      - name: Verify the format gate still has teeth
        run: ./tools/format/selftest.sh

      # The presenter-parity CHECK itself rides the step above (run-mock-tests.sh ends with it, in
      # every mode, where a C++ compiler is already guaranteed) — running it again here would only
      # pay for the same 200-row sweep twice. What needs its own step is its SELFTEST: both sides of
      # a parity gate are code, and the failure mode of any comparison is that it quietly stops
      # comparing, which reports the loudest possible green. This re-seeds each way the browser copy
      # can drift from the C++ rule — including the mixed-zone row this project has already shipped
      # once — and fails if any of them survives.
      - name: Verify the presenter-parity gate still has teeth
        if: steps.scope.outputs.presenter == 'yes'
        run: ./tools/presenter/selftest.sh

      # Translation completeness is its own fail-closed contract. Key/count parity catches newly
      # added copy; a canonical-source fingerprint also makes an edited English/domain sentence
      # stale in every shipped locale until that translation has been reviewed and moved with it.
      - name: Audit complete UI localization
        run: ./scripts/run-ui-localization-audit.sh
      - name: Verify the localization gate still has teeth
        run: node ./tools/ui_localization/selftest.mjs

      # One source of truth for the whole device UI. It executes every test_ui_*.mjs contract, the
      # HomeHub/MCP interaction boundaries and a behavioral matrix over the production one-time
      # wiring: every shipped modal, Cancel/backdrop/Escape, accepted/rejected/invalid Save paths, and the
      # ENV III board/no-sensor/sensor states. Its selftest re-seeds the undefined close-handler bug
      # that once left both footer buttons visible but inert.
      - name: Run complete UI use-case suite
        run: ./scripts/run-ui-use-case-tests.sh

      # Source contracts cannot see layout, native accessibility or real keyboard focus. Assemble
      # the production page and run it in system Chrome/Chromium. DOM/layout/names/colour, native AX
      # and keyboard navigation/dialog focus/Tab/Escape cover Dashboard, Settings and all routed
      # modals at 320/1200 px in all 13 locales. Reduced motion covers Dashboard, Settings, WiFi,
      # progress and disclosure motion at the same locale/viewport matrix; console errors are fatal.
      - name: Run rendered browser and accessibility gate
        run: ./scripts/run-browser-render-tests.sh

      # The source-boundary contracts: assertions about main/*.cpp that the host suite cannot make,
      # since it links the IDF-free headers alone. Pinned here are the X10A-gated MQTT lifecycle (a
      # no-LWT session may subscribe before X10A; the first bus proof replaces it with the LWT
      # publisher; ordinary publishes stay behind the gate), the one X10A-free outbound exception
      # (a bounded QoS-1 cleanup transaction reconstructed on every broker connection: predecessor
      # state plus retired/disabled discovery after persisted source, consent or identity changes;
      # that source's ordinary publish is suppressed for the cleanup cycle), the HomeHub discovery
      # lifecycle (only the explicit UI action may browse mDNS)
      # and the heating-curve-diagnosis boundary (the firmware records only raw target-minus-actual
      # room error and exposes no Modbus write capability; explicit consent subscribes the saved
      # room source, while forecast evidence remains optional and private). Collection is additionally
      # gated by HomeHub readiness, an active plant and a positively identified heating mode. These were
      # three bare `node` steps with no local entry point, so the
      # local loop skipped them and a new sibling was invisible everywhere at once; the script globs
      # test/test_*_contract.mjs, so one now joins the gate without a workflow edit.
      - name: Test firmware source-boundary contracts
        run: ./scripts/run-contract-tests.sh
      # The SOURCE-ABSENCE matrix runs inside the two suites above (test_source_absence_contract.mjs
      # rides the contract glob, test_ui_absence_matrix.mjs the UI one), so only its selftest needs a
      # step. It earns one for the reason the domain/schematic/redaction selftests do, and more
      # sharply: BOTH halves of that matrix assert over TEXT — firmware source and rendered markup —
      # so a check that has stopped matching the code it describes reports SUCCESS. A broken check
      # and a correct one are indistinguishable without re-seeding the defects, which is what this
      # does. It has already caught one of its own assertions written so that it could never fire.
      - name: Prove the source-absence matrix still catches its defects
        if: steps.scope.outputs.absence == 'yes'
        run: ./tools/absence/selftest.sh

      # Keep the source-linked ESP-IDF inventory honest. The checker derives its positive surface
      # from explicit CMake components, direct managed dependencies, active defaults and actual
      # IDF-shaped application includes. The evaluated negative list remains curated: CI does not
      # scrape an upstream web catalog or pretend that network availability proves completeness.
      - name: Audit the ESP-IDF feature matrix
        run: ./scripts/run-esp-idf-matrix-audit.sh
      - name: Verify the ESP-IDF matrix audit still has teeth
        if: steps.scope.outputs.esp_idf_matrix == 'yes'
        run: ./tools/esp_idf_matrix/selftest.sh

      # Domain-correctness gate: are the published values physically RIGHT? The logic tests above
      # verify the logic they are handed; they cannot see a well-formed value that is simply
      # false — a wrong converter compiles, passes them all, and publishes -971.5 °C to Home
      # Assistant (issues #35-#39). This runs the real converters over the real catalog against
      # docs/REGISTERS.md. The human half of the gate is the $domain-review skill + its PR
      # checkbox; this is the mechanical half.
      - name: Audit the value catalog
        run: ./scripts/run-domain-audit.sh
      # A checker that has stopped checking turns "clean" from evidence into a lie, so the audit
      # must keep catching the four decode bugs it was built for (re-introduced into a throwaway
      # copy; the tree is never touched).
      - name: Verify the audit still has teeth
        if: steps.scope.outputs.domain == 'yes'
        run: ./tools/domain/selftest.sh

      # Value-description coverage: the domain audit above asks whether a published value is
      # physically right; this asks whether the user can find out what it IS. A catalog label the
      # web UI's DESCRIPTIONS table doesn't match renders as a plain, un-tappable row — no error and
      # no log, so it ships unnoticed (def/overlay.hpp did exactly that with 11 rows). The catalog
      # is machine-generated and grows without touching this repo's JS, so the gap re-opens on its
      # own. Needs only node, which this runner already has.
      - name: Audit the value-description coverage
        run: ./scripts/run-description-audit.sh
      - name: Verify the description audit still has teeth
        run: ./tools/descriptions/selftest.sh

      # A tappable row can still explain a correct result only in installer language or omit what the
      # finding does NOT prove. This binds the English/German diagnosis baseline to its evidence and
      # English guide without inventing an unsupported recommendation. The separate localization
      # gate binds every other shipped locale to that reviewed source. This gate also rejects German
      # prose in maintained repository Markdown.
      # The source stamp makes evaluator/threshold/UI changes stale that guide even when no row was
      # added. The $user-docs-review skill is the human half; this is the fail-closed mechanical one.
      - name: Audit English plain-language diagnosis help
        run: ./scripts/run-user-docs-audit.sh
      - name: Verify the user-docs audit still has teeth
        run: ./tools/user_docs/selftest.sh

      # Source quality is a separate contract from plain language. Bind every visible diagnosis to
      # an external basis, the exact firmware rule, the project-only part and a claim boundary. The
      # review fingerprint changes with evaluator/sampling/fault/retry semantics, visible row ids,
      # the cited register evidence and the ledger itself. $diagnostic-evidence-review is the human
      # half; mutation tests prove the mechanical half cannot silently become ceremonial.
      - name: Audit diagnostic evidence and sources
        run: ./scripts/run-diagnostic-evidence-audit.sh
      - name: Verify the diagnostic-evidence audit still has teeth
        run: ./tools/diagnostic_evidence/selftest.sh

      # The dashboard schematic: the two audits above can BOTH be clean while the picture is false.
      # A pill can name a physically correct value, have copy for it, and still be drawn on the
      # wrong pipe — this drawing shipped a fan spinning around a point beside its own axle, the
      # leaving-water pill floating 40 px off its run, the return temperature on the heating-only
      # section, and "HEIZUNG" struck through by the heating riser. Parses the real SVG and
      # evaluates the real INSPECT/I18N/DESCRIPTIONS tables, so there is no second copy of the
      # coordinates or the rules to drift. Same runtime as the step above (node), seconds long.
      - name: Audit the dashboard schematic
        run: ./scripts/run-schematic-audit.sh
      - name: Verify the schematic audit still has teeth
        if: steps.scope.outputs.schematic == 'yes'
        run: ./tools/schematic/selftest.sh

      # Redaction coverage. A bug report is a PUBLIC issue carrying the device's own /status and
      # /diag (docs/REPORTING.md), which is only defensible because the device scrubs them first —
      # and the /diag half of that scrubbing is an ALLOWLIST of named log statements. A new
      # diag_printf interpolating a hostname or an SSID is simply not covered, and the symptom is a
      # correct-looking log line with a real value in it: no error, no failing test, nothing to
      # notice. This is the only gate here whose subject is the USER's data rather than the
      # firmware's correctness. python3 only, seconds long.
      - name: Audit the diag redaction coverage
        run: ./scripts/run-redaction-audit.sh
      - name: Verify the redaction audit still has teeth
        run: ./tools/redact/selftest.sh
      # The docs hand the reader copy-pasteable YAML naming Home Assistant entity ids, each derived
      # from a catalog LABEL — so an id is only as stable as the label, and the catalog spells the
      # same quantity several ways across models. A wrong id errors NOWHERE: HA builds the template
      # sensor, its availability guard never becomes true, and it sits at `unavailable`, which reads
      # as "my heat pump doesn't support this" rather than as a typo in the docs. Shipped that way
      # since #206 — the heat-meter recipe named one id that was never a valid slug and one that
      # exists only on the host-test FIXTURE profile detection can never assign. C++ host compiler
      # only, seconds long.
      - name: Audit the entity ids quoted in the docs
        run: ./scripts/run-doc-entity-audit.sh
      - name: Verify the doc entity-id audit still has teeth
        run: ./tools/docs/selftest.sh
      # The README's dashboard recording (docs/media/dashboard.gif): the one artefact here that rots
      # INVISIBLY. A recording renders perfectly forever, whatever the UI has since become, so every
      # other gate on this page stays green while the first thing a new reader sees is last month's
      # drawing. CI has no browser, so this is a STAMP comparison rather than a re-render: it
      # fingerprints the sources the recording was made from — the schematic markup, the CSS that
      # draws and animates it, the painting code, the strings, the scenes and the recorder's own
      # framing — and fails when the GIF no longer belongs to them. node only, seconds long.
      #
      # This was deliberately NOT a step here, on the argument that a gate whose remedy is
      # unavailable where it fires does not get the recording re-made: it gets the STAMP re-written
      # to clear the red, and the GIF then carries a stamp ASSERTING it is current, which is
      # strictly worse than no gate at all. The remedy is still local (scripts/record-dashboard-gif.sh
      # needs Chrome + ffmpeg); what closed is the escape. check_ui_gif.mjs now REFUSES to write a
      # stamp whose sources moved while the GIF bytes did not — the exact signature of a re-stamp
      # over an old recording — so red here can only be cleared by a real re-record.
      #
      # What the old arrangement cost is measurable rather than theoretical: with the recording's
      # currency nobody's merge condition, the README went stale ONE merge after it was last made
      # (#462 swapped the schematic's circuits on 2026-08-13, against a stamp written the same day),
      # and no gate anywhere could say so. The judgement half — are the nine operating scenes still
      # true, are the readings still honest — remains the canonical $ui-gif skill's, now a merge
      # gate of its own.
      - name: Audit the README's dashboard recording
        run: ./scripts/run-ui-gif-audit.sh
      - name: Verify the recording audit still has teeth
        if: steps.scope.outputs.uigif == 'yes'
        run: ./tools/uigif/selftest.sh

      # The gh-pages publish follows the expensive firmware build, so a regression still fails late.
      # It also has a concurrency hazard: the release root and every merge's dev channel write one
      # branch. Exercise it here
      # against a throwaway bare repo — no network, no credentials, seconds long — so a regression
      # fails before the build, not after it.
      - name: Test the gh-pages publish (incl. concurrent publishers)
        run: ./scripts/run-pages-publish-tests.sh
      - name: Test the NVS-preserving Web Serial plan gate
        run: ./scripts/run-web-installer-plan-tests.sh
      - name: Test the publish-version gate
        run: ./scripts/run-publish-version-tests.sh
      - name: Test CI trust boundaries and release contracts
        run: ./scripts/run-ci-release-contract-tests.sh
      - name: Test the coredump artifact decoder
        run: ./scripts/run-decode-coredump-tests.sh

      # Two cheap build-contract selftests. The first proves the post-Kconfig comparison catches a
      # missing, changed or malformed default before the firmware compile. The second pins the
      # parser that turns ESP-IDF's json2 size data into the artifact/job-summary budget table.
      - name: Test the ESP-IDF build contracts
        run: |
          python3 scripts/check-sdkconfig-defaults.py --self-test
          python3 scripts/report-firmware-size.py --self-test
          python3 scripts/check-manifest-provenance.py --self-test
          python3 scripts/check-signing-key-continuity.py --self-test
          python3 scripts/check-stack-budget.py --self-test
          python3 scripts/check-reproducible-build.py --self-test
          python3 scripts/verify-published-artifacts.py --self-test
          python3 scripts/production-ota-gate.py --self-test

      # The canonical instruction contract owns the always-loaded budget and the deterministic
      # skill, reviewer, hook and safety-invariant checks.
      - name: Check agent instruction and configuration integrity
        run: ./scripts/run-agent-instructions-budget.sh
      - name: Verify the agent configuration gate still has teeth
        if: steps.scope.outputs.agent_config == 'yes'
        run: ./tools/agent-config/selftest.sh
      - name: Verify runner-neutral hook guards and merge binding
        if: steps.scope.outputs.agent_hooks == 'yes'
        run: ./tools/agent-hooks/selftest.sh

      # Review evidence is PR state, not a file marker. The canaries prove missing inputs, missing or
      # stale stamps and conditional relevance fail CLOSED for canonical `$name` records. Live
      # enforcement runs separately in the required data-only `pr-policy.yml` workflow.
      - name: Verify the PR evidence policy still has teeth
        if: steps.scope.outputs.agent_policy == 'yes'
        run: ./tools/agent-policy/selftest.sh

      # Does this change reach anything the FIRMWARE BUILD or the PUBLISHED SITE is made of? If
      # not, the ~5-minute PR compile steps or trusted-main build are skipped. The required PR
      # `build` job still reports the mechanical result. Docs, skills and review tooling cannot
      # change a byte of the image, and proving that by compiling every README edit was the single
      # largest avoidable cost in this pipeline.
      #
      # The list is deliberately WIDER than "sources": scripts/build-pages.sh, the browser-installer
      # files under docs/, scripts/publish-pages-branch.sh and its GraphQL payload helper produce or
      # place the published artifacts, so a change to them must still build and republish even
      # though the image bytes are identical.
      #
      # A push to main additionally decides the DEV PUBLISH with this flag (see the build job): a
      # docs-only merge must not move the version and hand every dev device a byte-identical image.
      - name: Detect build-relevant changes
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # tools/web_asset/ is a BUILD/PUBLICATION INPUT, not tooling: main/CMakeLists.txt runs its
          # minifier over the web UI and embeds the result in the image, while build-pages.sh copies
          # vendor/LICENSE into both feeds. A change there must therefore rebuild and republish.
          # production-ota-gate.py also binds local HEAD to manifest.source_sha; publishing its
          # changes without a new artifact would make the corrected gate impossible to execute.
          relevant='^(LICENSE$|THIRD_PARTY_NOTICES[.]md$|main/|CMakeLists[.]txt$|sdkconfig[.]defaults$|dependencies[.]lock$|partitions[.]csv$|version[.]txt$|docs/(index[.]html|serial-port-release[.]mjs|web-installer[.]mjs)$|[.]github/workflows/build[.]yml$|scripts/(ci-build-all|build-pages|next-version|publish-pages-branch|require-signed|check-publish-version|idf-version|check-nonflashable-artifacts)[.]sh$|scripts/pages-commit-payload[.]mjs$|scripts/(generate-ota-changelog|check-sdkconfig-defaults|report-firmware-size|check-web-installer-plan|check-manifest-provenance|check-signing-key-continuity|check-stack-budget|check-reproducible-build|verify-published-artifacts|production-ota-gate)[.]py$|tools/(version|web_asset|release|stack)/)'
          case "${{ github.event_name }}" in
            pull_request)
              # HEAD is the PR's merge ref, so HEAD^1 is the base tip: the diff is exactly what
              # this PR changes, no matter how many commits it took or what landed on main since.
              range="HEAD^1 HEAD" ;;
            push)
              # A force-push (or the first push of a branch) can leave `before` unresolvable —
              # then build, rather than guess.
              if [ -z "$BEFORE" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
                range=""
              else
                range="$BEFORE ${{ github.sha }}"
              fi ;;
            *)
              # A manual dispatch is an explicit request to build (and possibly to cut a release).
              range="" ;;
          esac
          # NOT `git diff … | grep -q`: under `set -o pipefail`, grep -q exits at the first match and
          # git diff then dies of SIGPIPE, making the whole pipeline non-zero — so a LONG changed-file
          # list with an early relevant match would take the else branch and skip the build in exactly
          # the case that needs one. Materialise the list first; the failure direction matters more
          # than the pipe.
          if [ -z "$range" ]; then
            changed=yes
          else
            git diff --name-only $range > /tmp/changed-files.txt
            if grep -qE "$relevant" /tmp/changed-files.txt; then
              changed=yes
            else
              changed=no
            fi
          fi
          echo "firmware=$changed" >> "$GITHUB_OUTPUT"
          echo "build-relevant changes: $changed"

  # Required untrusted-source check. It always reflects mechanical_gates, while the expensive
  # compile steps run only when the diff reaches firmware or published-site inputs. This job stays
  # named `build` because branch protection requires it; docs-only PRs pass it without compiling.
  build:
    needs: [mechanical_gates]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Require the mechanical gates
        env:
          MECHANICAL_RESULT: ${{ needs.mechanical_gates.result }}
        run: |
          [ "$MECHANICAL_RESULT" = success ] \
            || { echo "mechanical gates finished as $MECHANICAL_RESULT" >&2; exit 2; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: needs.mechanical_gates.result == 'success' && needs.mechanical_gates.outputs.firmware == 'yes'
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bind compiled merge tree to the reviewed head
        if: needs.mechanical_gates.result == 'success' && needs.mechanical_gates.outputs.firmware == 'yes'
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          tested_base="$(git rev-parse HEAD^1)"
          tested_head="$(git rev-parse HEAD^2)"
          # The HEAD binding is exact and stays exact: it is what stops CI from attesting a tree
          # the reviewer never saw, and every review stamp names this SHA.
          [ "$tested_head" = "$EVENT_HEAD_SHA" ] \
            || { echo "compiled merge tree uses $tested_head, expected $EVENT_HEAD_SHA" >&2; exit 2; }
          # The BASE binding cannot be exact. `pull_request.base.sha` is the base tip from when the
          # PR was opened and never moves again — a synchronize does not refresh it — while
          # refs/pull/N/merge is recomputed against the LIVE base. An equality check therefore held
          # only until `main` moved under an open PR, which CONTRIBUTING.md says out loud that it
          # does ("main moves under open PRs — expect to rebase before merge"), and no rebase can
          # clear it: the stale value is on the PR object, not on the branch. The real invariant is
          # weaker and is what this asserts — the tested tree merged the reviewed head onto a commit
          # that is ON the base branch and no older than the reviewed base.
          base_tip="$(git rev-parse --verify -q "refs/remotes/origin/$BASE_REF" || true)"
          if [ -z "$base_tip" ]; then
            git fetch --no-tags --quiet origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" || true
            base_tip="$(git rev-parse --verify -q "refs/remotes/origin/$BASE_REF" || true)"
          fi
          [ -n "$base_tip" ] \
            || { echo "cannot resolve the tip of base branch $BASE_REF" >&2; exit 2; }
          git merge-base --is-ancestor "$tested_base" "$base_tip" \
            || { echo "compiled merge tree base $tested_base is not on $BASE_REF" >&2; exit 2; }
          git merge-base --is-ancestor "$EVENT_BASE_SHA" "$tested_base" \
            || { echo "compiled merge tree base $tested_base predates the reviewed base $EVENT_BASE_SHA" >&2; exit 2; }

      - name: Stamp compile-only firmware version
        if: needs.mechanical_gates.result == 'success' && needs.mechanical_gates.outputs.firmware == 'yes'
        id: stamp
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "invalid PR number: $PR_NUMBER" >&2; exit 2; }
          disp="$(./scripts/next-version.sh)-PR-${PR_NUMBER}"
          echo "$disp" > version.txt
          echo "disp=$disp" >> "$GITHUB_OUTPUT"
          echo "stamping compile-only build $disp"

      - name: Derive the ccache key
        if: needs.mechanical_gates.result == 'success' && needs.mechanical_gates.outputs.firmware == 'yes'
        id: cckey
        run: |
          set -euo pipefail
          idf="$(./scripts/idf-version.sh)"
          h="$( { printf 'idf=%s\n' "$idf"; cat sdkconfig.defaults dependencies.lock; } | sha256sum | cut -c1-16 )"
          echo "hash=$h" >> "$GITHUB_OUTPUT"

      - name: Restore ccache
        if: needs.mechanical_gates.result == 'success' && needs.mechanical_gates.outputs.firmware == 'yes'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: .ccache
          key: ccache-esp32s3-${{ steps.cckey.outputs.hash }}-${{ github.run_id }}
          restore-keys: |
            ccache-esp32s3-${{ steps.cckey.outputs.hash }}-

      - name: Compile firmware without flashable artifacts
        if: needs.mechanical_gates.result == 'success' && needs.mechanical_gates.outputs.firmware == 'yes'
        uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5  # v1.2.0
        with:
          esp_idf_version: v6.1
          target: esp32s3
          command: ./scripts/ci-build-all.sh --compile-only --source-sha "${{ github.event.pull_request.head.sha }}" "${{ steps.stamp.outputs.disp }}"

      - name: Publish firmware size summary
        if: always() && needs.mechanical_gates.result == 'success' && needs.mechanical_gates.outputs.firmware == 'yes'
        run: |
          if [ -f dist/daikin-altherma-esp32-size.md ]; then
            cat dist/daikin-altherma-esp32-size.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Hand the ccache tree back to the runner
        if: always() && needs.mechanical_gates.result == 'success' && needs.mechanical_gates.outputs.firmware == 'yes'
        run: sudo chown -R "$(id -u):$(id -g)" .ccache || true

      - name: Enforce non-flashable PR artifact boundary
        if: needs.mechanical_gates.result == 'success' && needs.mechanical_gates.outputs.firmware == 'yes'
        run: ./scripts/check-nonflashable-artifacts.sh dist

      - name: Upload compile diagnostics
        if: needs.mechanical_gates.result == 'success' && needs.mechanical_gates.outputs.firmware == 'yes'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: daikin-altherma-esp32-${{ steps.stamp.outputs.disp }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/*.elf.xz
            dist/*.elf.sha256
            dist/*-size.json
            dist/*-size.md

  # Trusted main build. This job can read the signing key but its token remains read-only; the
  # separate publisher below owns contents:write and never receives the private key.
  trusted_build:
    needs: [mechanical_gates]
    # Skipped — not failed — when nothing the image or the site is made of changed. A skipped job
    # still reports its check, so this stays compatible with `build` as a required check.
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      ((github.event_name == 'workflow_dispatch' && inputs.release == true) ||
      (needs.mechanical_gates.result == 'success' &&
      needs.mechanical_gates.outputs.firmware == 'yes'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      version: ${{ steps.stamp.outputs.disp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0   # full history + tags for versioning / change detection

      # This job is structurally restricted to trusted main. A manual release is the only release
      # mode; every other admitted event publishes the dev channel.
      - name: Decide the run mode
        id: mode
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.release }}" = "true" ]; then
            mode=release
          else
            mode=dev
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "run mode: $mode"

      # Stamp the embedded firmware version (esp_app_get_description()->version) so the running
      # image, the release tag and the manifest can never drift. version.txt is the committed
      # FLOOR; here we overwrite it in the workspace (NOT committed) with what we publish.
      #
      #   release  X.Y.Z              (the bump level the dispatch picked; the only tagged shape)
      #   dev      X.Y.Z-dev.N        (N = commits since the last tag — a semver PRE-RELEASE of the
      #                                next release, so it sorts above the last release and below
      #                                the next one; see scripts/next-version.sh)
      #   pr       X.Y.Z-PR-<number>  (never published anywhere — it labels the build ARTIFACT, so a
      #                                core dump from a manually flashed PR build still finds its .elf)
      - name: Stamp firmware version
        id: stamp
        env:
          BUMP: ${{ inputs.bump }}
          REQUESTED_RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          case "${{ steps.mode.outputs.mode }}" in
            release)
              if [ -n "$REQUESTED_RELEASE_VERSION" ]; then
                disp="$(./scripts/next-version.sh --exact "$REQUESTED_RELEASE_VERSION")"
              else
                disp="$(./scripts/next-version.sh "$BUMP")"
              fi
              if git rev-parse --verify --quiet "v${disp}^{commit}" >/dev/null; then
                tag_sha="$(git rev-parse "v${disp}^{commit}")"
                [ "$tag_sha" = "$GITHUB_SHA" ] || {
                  echo "refusing to attach a rebuilt artifact to v$disp at $tag_sha (run is $GITHUB_SHA)" >&2
                  exit 1
                }
              fi ;;
            dev)
              [ -z "$REQUESTED_RELEASE_VERSION" ] || {
                echo "release_version requires release=true" >&2
                exit 2
              }
              disp="$(./scripts/next-version.sh --dev)" ;;
          esac
          echo "$disp" > version.txt
          echo "disp=$disp" >> "$GITHUB_OUTPUT"
          echo "stamping $disp"

      # Would a device on the currently-published build accept the one this run would publish? The
      # version above is DERIVED (from the v* tag list, floored by version.txt), so it can silently
      # be the wrong number — and it has been: on 2026-07-24 the tags were deleted, next-version.sh
      # fell back to the 1.0.0 floor, and the next merge republished dev/ as 1.0.0-dev.168 over the
      # 1.0.14-dev.2 it had just served. CI went green; the feed had simply stopped being able to
      # move anyone forward. The check asks the DEVICE's own question (ota_is_upgrade, the predicate
      # ota_update.cpp installs by) against the feed this run writes, so "CI published it" and "a
      # board will take it" cannot diverge. Here rather than next to the publish steps: it needs
      # only the stamped version, so it costs seconds and fails before the ~5-minute build, before
      # the tag and before the GitHub Release.
      - name: Check the version moves its feed forward
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          VERSION: ${{ steps.stamp.outputs.disp }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          check_mode="$MODE"
          if [ "$MODE" = release ]; then
            check_mode=release-resume
          elif [ "$MODE" = dev ] && [ "$RUN_ATTEMPT" -gt 1 ]; then
            check_mode=dev-resume
          fi
          ./scripts/check-publish-version.sh --source-sha "$SOURCE_SHA" "$check_mode" "$VERSION"

      # Build notes are public feed metadata, even while the source repository is private. Generate
      # them from explicitly classified user-facing first-parent commit subjects, plus the one
      # reviewed version/source-bound legacy migration seed, against the exact source recorded by
      # the currently published feed. check-publish-version.sh above has fetched gh-pages into
      # FETCH_HEAD; a same-source release resume reuses its validated changelog byte-for-byte.
      - name: Generate public OTA changelog
        run: >-
          ./scripts/generate-ota-changelog.py
          --channel "${{ steps.mode.outputs.mode }}"
          --version "${{ steps.stamp.outputs.disp }}"
          --source-sha "${{ github.sha }}"
          --published-ref FETCH_HEAD
          --output ota-changelog.json

      # Materialize the OTA signing key only inside this trusted-main/read-only-token job. PR code
      # cannot enter this job, and the later contents:write publisher never receives the key.
      - name: Provision OTA signing key
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$OTA_SIGNING_KEY" ]; then
            echo "::error::Refusing to publish UNSIGNED firmware — set the OTA_SIGNING_KEY secret (docs/SECURITY.md)." >&2
            exit 1
          fi
          printf '%s\n' "$OTA_SIGNING_KEY" > ota_signing_key.pem
          chmod 600 ota_signing_key.pem

      # ccache across runs. `idf.py set-target` wipes the build directory, so every CI compile
      # started from zero — measured, that is ~3 minutes of this job's ~5 (the other ~2 are the
      # espressif/idf image pull, which no cache here can shorten). ccache is content-addressed,
      # so a hit is byte-identical output: the version string this run stamps changes exactly the
      # one generated app-descriptor object, not the rest of the graph.
      #
      # Written into the WORKSPACE (.ccache, gitignored) because the build runs inside the ESP-IDF
      # container and the workspace is the only path that survives it. ci-build-all.sh turns
      # IDF_CCACHE_ENABLE on itself when the ccache binary is present, so a toolchain image
      # without it degrades to today's behaviour instead of failing the build.
      #
      # Restored on every run and saved only by this trusted-main job. Untrusted builds can read the
      # base cache, but never upload their own objects into a cache later builds restore.
      # The cache key must change when the cached objects go stale — and NOT otherwise. It used to
      # be hashFiles('.github/workflows/build.yml', 'sdkconfig.defaults'), i.e. the hash of this
      # WHOLE FILE, so every edit to this workflow threw the cache away. Most edits to it change no
      # build input at all: PR #189 deleted a two-line comment and paid a full cold compile (~3 of
      # the build job's ~5 minutes) for it, and this file is edited often.
      #
      # What actually invalidates the objects is the TOOLCHAIN (esp_idf_version, which decides the
      # compiler), the BUILD CONFIG (sdkconfig.defaults) and the resolved managed-component graph
      # (dependencies.lock), so key on exactly those. The pin is read through
      # scripts/idf-version.sh — the same reader scripts/idf-docker.sh uses — so the cache key and
      # the image the build runs in cannot key on different versions.
      #
      # Narrowing the key is safe in the direction that matters: ccache is content-addressed, so a
      # stale object is never *served* for a changed input (the hash simply misses). The old wide
      # key was only ever about not carrying dead objects along, and the two real producers of dead
      # objects are still covered.
      - name: Derive the ccache key
        id: cckey
        run: |
          set -euo pipefail
          idf="$(./scripts/idf-version.sh)"
          h="$( { printf 'idf=%s\n' "$idf"; cat sdkconfig.defaults dependencies.lock; } | sha256sum | cut -c1-16 )"
          echo "hash=$h" >> "$GITHUB_OUTPUT"
          echo "ccache key: target esp32s3 / IDF $idf / defaults + dependency lock -> $h"

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: .ccache
          key: ccache-esp32s3-${{ steps.cckey.outputs.hash }}-${{ github.run_id }}
          restore-keys: |
            ccache-esp32s3-${{ steps.cckey.outputs.hash }}-

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5  # v1.2.0
        with:
          esp_idf_version: v6.1
          target: esp32s3
          # ci-build-all.sh builds esp32s3 and stages the signed OTA app, sparse NVS-preserving
          # Web Serial parts, the manual full-flash merged image, compact manifest.json and its
          # exact manifest-bound artifacts.json inventory into dist/.
          #
          # Pass the STAMPED version (what version.txt above put into the image). OTA compares the
          # manifest version to the version the running app reports, so publishing a manifest the
          # bins don't embed makes every device download an "update" that changes nothing, forever.
          # ci-build-all.sh reads the version back out of the built image and fails if the two ever
          # drift apart again.
          command: ./scripts/ci-build-all.sh --source-sha "${{ github.sha }}" --changelog-file ota-changelog.json "${{ steps.stamp.outputs.disp }}"

      - name: Publish firmware size summary
        if: always()
        run: |
          if [ -f dist/daikin-altherma-esp32-size.md ]; then
            cat dist/daikin-altherma-esp32-size.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Shred OTA signing key
        if: always()
        run: rm -f ota_signing_key.pem

      # The container ran as root, so the cache tree it wrote is root-owned and the runner user
      # cannot read it back out. `|| true`: an unsaveable cache costs a cold compile next time,
      # which is not worth failing a green build over.
      - name: Hand the ccache tree back to the runner
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .ccache || true

      - name: Save ccache
        if: github.ref == 'refs/heads/main' && success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: .ccache
          key: ccache-esp32s3-${{ steps.cckey.outputs.hash }}-${{ github.run_id }}

      # This is the only cross-job handoff. It contains signed flashables, but never the private key;
      # the publisher downloads it with actions:read and owns the only contents:write token.
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: daikin-altherma-esp32-${{ steps.stamp.outputs.disp }}
          retention-days: ${{ steps.mode.outputs.mode == 'dev' && 3 || 90 }}
          if-no-files-found: error
          path: |
            dist/*.bin
            dist/*.elf.xz
            dist/*.elf.sha256
            dist/*-size.json
            dist/*-size.md
            dist/manifest.json
            dist/artifacts.json
            dist/changelog.json

  # Outward mutation boundary. It has contents:write but no signing secret and consumes only the
  # signed artifact produced by trusted_build. A failed publish can be retried without exposing the
  # key to a write-capable job.
  publish:
    needs: [trusted_build]
    # `trusted_build` deliberately admits a manual release through a skipped mechanical_gates job.
    # `always()` prevents GitHub's implicit success() from propagating that transitive skip while
    # the explicit result check still fails closed when the signed build itself did not succeed.
    if: always() && needs.trusted_build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Download signed build handoff
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARTIFACT_NAME: daikin-altherma-esp32-${{ needs.trusted_build.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
          MODE: ${{ needs.trusted_build.outputs.mode }}
          VERSION: ${{ needs.trusted_build.outputs.version }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$GITHUB_RUN_ID" --repo "$GH_REPO" --name "$ARTIFACT_NAME" --dir dist
          test -f dist/manifest.json
          test -f dist/artifacts.json
          test -f dist/changelog.json
          test -f dist/daikin-altherma-esp32.bin
          ./scripts/check-manifest-provenance.py dist/manifest.json \
            dist/daikin-altherma-esp32.bin "$SOURCE_SHA" "$(./scripts/idf-version.sh)" dependencies.lock
          ./scripts/check-signing-key-continuity.py dist/daikin-altherma-esp32.bin
          ./scripts/check-web-installer-plan.py dist/manifest.json partitions.csv
          ./scripts/generate-ota-changelog.py --validate dist/changelog.json --version "$VERSION"
          check_mode="$MODE"
          if [ "$MODE" = release ]; then
            check_mode=release-resume
          elif [ "$MODE" = dev ] && [ "$RUN_ATTEMPT" -gt 1 ]; then
            check_mode=dev-resume
          fi
          ./scripts/check-publish-version.sh --source-sha "$SOURCE_SHA" "$check_mode" "$VERSION"

      - name: Assemble dev-channel site
        if: needs.trusted_build.outputs.mode == 'dev'
        run: ./scripts/build-pages.sh --dev
      - name: Publish dev channel to gh-pages
        if: needs.trusted_build.outputs.mode == 'dev'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_OID_FILE: ${{ runner.temp }}/pages-published-oid
        run: ./scripts/publish-pages-branch.sh --dev

      # Publish the release feed BEFORE creating its tag/Release. If this fails, no immutable release
      # exists. If a later API call fails, a workflow rerun may repeat an already-published
      # dev or release version only when its manifest names this exact github.sha; release_version
      # can explicitly resume a release even after a tag was partially created.
      - name: Assemble Pages site (release channel)
        if: needs.trusted_build.outputs.mode == 'release'
        run: ./scripts/build-pages.sh
      - name: Publish site to gh-pages (root)
        if: needs.trusted_build.outputs.mode == 'release'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_OID_FILE: ${{ runner.temp }}/pages-published-oid
        run: ./scripts/publish-pages-branch.sh

      - name: Verify public feed readback
        if: needs.trusted_build.outputs.mode == 'dev'
        env:
          BASE_URL: https://0bu.github.io/daikin-altherma-esp32/dev/
          SITE_DIR: _site/dev
          PAGES_PREFIX: dev
          PUBLISH_OID_FILE: ${{ runner.temp }}/pages-published-oid
        run: |
          set -euo pipefail
          test -f "$PUBLISH_OID_FILE"
          pages_commit="$(cat "$PUBLISH_OID_FILE")"
          git fetch --quiet --no-tags --force origin \
            refs/heads/gh-pages:refs/remotes/origin/gh-pages
          ./scripts/verify-published-artifacts.py \
            --base-url "$BASE_URL" \
            --expected-site "$SITE_DIR" \
            --pages-commit "$pages_commit" \
            --pages-prefix "$PAGES_PREFIX" \
            --cache-buster "$GITHUB_RUN_ID" \
            --attempts 30

      - name: Rebind release tag immediately before release mutation
        if: needs.trusted_build.outputs.mode == 'release'
        env:
          VERSION: ${{ needs.trusted_build.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            git fetch --quiet --no-tags --force origin \
              "refs/tags/v$VERSION:refs/tags/v$VERSION"
            tag_sha="$(git rev-parse "v$VERSION^{commit}")"
            [ "$tag_sha" = "$SOURCE_SHA" ] || {
              echo "v$VERSION moved to $tag_sha; expected $SOURCE_SHA" >&2
              exit 1
            }
          fi

      - name: Create or resume release
        if: needs.trusted_build.outputs.mode == 'release'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3
        with:
          tag_name: v${{ needs.trusted_build.outputs.version }}
          name: v${{ needs.trusted_build.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.bin
            dist/*.elf.xz
            dist/*.elf.sha256
            dist/*-size.json
            dist/*-size.md
            dist/manifest.json
            dist/artifacts.json
            dist/changelog.json
            _site/LICENSE.txt
            _site/THIRD_PARTY_NOTICES.md
            _site/Apache-2.0.txt

      - name: Verify release tag target
        if: needs.trusted_build.outputs.mode == 'release'
        env:
          VERSION: ${{ needs.trusted_build.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags --force origin \
            "refs/tags/v$VERSION:refs/tags/v$VERSION"
          tag_sha="$(git rev-parse "v$VERSION^{commit}")"
          [ "$tag_sha" = "$SOURCE_SHA" ] || {
            echo "published v$VERSION resolves to $tag_sha; expected $SOURCE_SHA" >&2
            exit 1
          }
