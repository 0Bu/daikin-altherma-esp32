name: Feature / task
description: A change to implement — framed so an AI coding agent (or a human) can pick it up and know when it's done.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the change as an actionable spec. Clear acceptance criteria ("done when…") let an implementer verify it, not just guess at intent.
  - type: textarea
    id: motivation
    attributes:
      label: Problem / motivation
      description: What need does this address? What prompted it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change & acceptance criteria
      description: What should change, and how do we know it's done?
      placeholder: |
        Change: ...
        Done when:
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which component (from the architecture map linked by AGENTS.md)?
      options:
        - X10A comm / CRC / protocol (hp_comm)
        - Poll engine (hp_poll)
        - Value converters / model profiles (logic/convert, def/)
        - HomeHub / Altherma 4 Modbus
        - History / persistence / NVS
        - HTTP server / API
        - Web UI (www/) / configuration
        - MQTT / Home Assistant bridge
        - WiFi / provisioning (setup portal)
        - OTA / self-update
        - Browser installer / firmware publication
        - MCP server (/mcp)
        - Build / CI / logic tests
        - Agent tooling / skills / hooks
        - Docs
        - Other / not sure
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Repository invariants in [AGENTS.md](https://github.com/0Bu/daikin-altherma-esp32/blob/main/AGENTS.md) apply to every change. Follow its authorization boundary and update the document that owns each changed contract; [CONTRIBUTING.md](https://github.com/0Bu/daikin-altherma-esp32/blob/main/CONTRIBUTING.md) explains placement and verification.
  - type: markdown
    attributes:
      value: |
        <sub>A remote agent session can edit/review and lean on CI, but cannot assume a Docker daemon, a local firmware build, or USB flashing.</sub>
