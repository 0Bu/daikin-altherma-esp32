<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daikin Altherma · Setup</title>
<style>
:root {
  --brand:#0097E0; --brand-strong:#0079BD; --brand-tint:#E9F6FD;
  --bg:#F4F5F7; --card:#FFFFFF; --fg:#1C2530; --muted:#6B7480; --line:#E2E5EA; --soft:#F1F3F5;
  --err:#D23B3B;
  --shadow-logo:0 2px 8px rgba(0,151,224,.35); --shadow-cta:0 3px 12px rgba(0,151,224,.30);
  --shadow-card:0 1px 2px rgba(16,20,28,.05),0 6px 20px rgba(16,20,28,.07);
  --font-sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --brand:#33ABE8; --brand-strong:#0097E0; --brand-tint:#12202B;
          --bg:#12151A; --card:#1B1F27; --fg:#E6E9EE; --muted:#93A0AF; --line:#2A2F39; --soft:#20242C;
          --shadow-card:0 1px 2px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.45); }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-sans); min-height: 100vh; }
.wrap { max-width: 460px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
.hero { background: var(--brand-tint); padding: 30px 24px 32px; border-bottom: 1px solid var(--line); }
.mark { display: flex; align-items: center; gap: 11px; }
.logo { width: 38px; height: 38px; flex: none; border-radius: 11px; background: var(--brand);
        display: grid; place-items: center; box-shadow: var(--shadow-logo); color: #fff; }
.name { font-family: var(--font-mono); font-size: 15px; font-weight: 600; letter-spacing: .2px; color: var(--fg); }
h1 { font-size: 26px; font-weight: 650; letter-spacing: -.5px; margin: 20px 0 7px; }
.sub { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; max-width: 34ch; }
.body { padding: 22px 20px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow-card); padding: 18px; }
label { display: block; font-size: 12px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase;
        color: var(--muted); margin: 0 0 8px 2px; }
select, input { width: 100%; font: inherit; font-size: 15px; font-family: var(--font-sans);
        padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--soft); color: var(--fg); appearance: none; }
select { margin-bottom: 16px; }
input { margin-bottom: 16px; }
select:focus, input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(0,151,224,.22); }
button { width: 100%; font: inherit; font-family: var(--font-sans); font-weight: 600; font-size: 15px;
        padding: 13px; border: 0; border-radius: 12px; background: var(--brand); color: #fff; cursor: pointer; box-shadow: var(--shadow-cta); }
button:hover { background: var(--brand-strong); }
button:disabled { opacity: .6; cursor: default; box-shadow: none; }
.msg { font-size: 13px; color: var(--muted); min-height: 1.2em; margin: 12px 2px 0; text-align: center; }
.msg.err { color: var(--err); }
.served { font-size: 12.5px; color: var(--muted); text-align: center; margin: 16px 0 0; font-family: var(--font-mono); }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="mark">
      <span class="logo"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="13.5" rx="2.3"/><circle cx="8.6" cy="11.75" r="4.15"/><path d="M8.6 11.75C8.05 9.9 8.15 8.3 8.6 7.75 9.05 8.3 9.15 9.9 8.6 11.75Z"/><path d="M8.6 11.75C8.05 9.9 8.15 8.3 8.6 7.75 9.05 8.3 9.15 9.9 8.6 11.75Z" transform="rotate(120 8.6 11.75)"/><path d="M8.6 11.75C8.05 9.9 8.15 8.3 8.6 7.75 9.05 8.3 9.15 9.9 8.6 11.75Z" transform="rotate(240 8.6 11.75)"/><circle cx="8.6" cy="11.75" r="1.05" fill="currentColor" stroke="none"/><path d="M15 8.4h3.6M15 10.2h3.6M15 12h3.6M15 13.8h3.6M15 15.6h3.6"/><path d="M6.4 18.5V20M17.6 18.5V20"/></svg></span>
      <span class="name">daikin-altherma-esp32</span>
    </div>
    <h1>Connect to WiFi</h1>
    <p class="sub">You're on the device's setup network. Pick your home WiFi to bring it online.</p>
  </div>
  <div class="body">
    <form class="card" id="f">
      <label for="ssid">WiFi network (SSID)</label>
      <select id="ssid" name="ssid" required><option value="">Scanning… select a network</option></select>
      <label for="pass">Password</label>
      <input id="pass" name="pass" type="password" autocomplete="off" placeholder="WiFi password">
      <button type="submit" id="btn">Save &amp; reboot</button>
      <div class="msg" id="msg"></div>
    </form>
    <p class="served">served from daikin-altherma-esp32-setup · 192.168.4.1</p>
  </div>
</div>
<script>
  const el = (id) => document.getElementById(id);
  // Populate the SSID list from the device's scan (GET /scan → {networks:[{ssid,rssi}]}).
  fetch("/scan").then((r) => r.json()).then((r) => {
    const list = (r.networks || r || []).slice().sort((a, b) => (b.rssi || -999) - (a.rssi || -999));
    if (!list.length) { textInput(); return; }   // SoftAP can't scan → let the user type the SSID
    el("ssid").innerHTML = list.map((n) => `<option value="${n.ssid}">${n.ssid} · ${n.rssi} dBm</option>`).join("");
  }).catch(textInput);
  // Scan unavailable or empty: swap the dropdown for a free-text SSID input so setup still works.
  function textInput() {
    const cur = el("ssid");
    if (cur.tagName === "INPUT") return;
    const inp = document.createElement("input");
    inp.id = "ssid"; inp.name = "ssid"; inp.placeholder = "Network name (SSID)"; inp.required = true; inp.autocomplete = "off";
    cur.replaceWith(inp);
  }

  el("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const ssid = el("ssid").value.trim();
    if (!ssid) { el("msg").textContent = "Choose or enter a network."; el("msg").className = "msg err"; return; }
    el("btn").disabled = true; el("btn").textContent = "Rebooting…";
    el("msg").className = "msg"; el("msg").textContent = "Saving…";
    try {
      await fetch("/set_wifi", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ssid, pass: el("pass").value }) });
      el("msg").textContent = "Saved — rebooting. Rejoin your WiFi, then open daikin-altherma-esp32.local.";
    } catch {
      el("btn").disabled = false; el("btn").textContent = "Save & reboot";
      el("msg").className = "msg err"; el("msg").textContent = "Failed — try again.";
    }
  });
</script>
</body>
</html>
