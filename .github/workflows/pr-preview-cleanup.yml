name: pr-preview-cleanup

# When a PR closes (merged or not), delete its per-PR firmware preview from gh-pages (PR/<N>/)
# so stale builds don't linger on the installer site. Only same-repo PRs ever published a
# preview (fork PRs can't sign/push), so fork closes are skipped.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write

concurrency:
  group: gh-pages-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cleanup:
    # Same-repo PRs only: a fork PR gets no signing key, so it never published a preview to clean up
    # (build.yml). No visibility gate — build.yml publishes previews from a private repo too, so a
    # closed PR must have its preview removed either way or stale builds linger on the public site.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          # gh-pages must be fetched for publish-pages-branch.sh to check it out and push it back
          # (the script re-fetches defensively, but a shallow clone can't push the result). This
          # matches build.yml, whose gh-pages push works from the same full-history checkout.
          fetch-depth: 0
      - name: Remove PR preview from gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/publish-pages-branch.sh --rm "${{ github.event.pull_request.number }}"
