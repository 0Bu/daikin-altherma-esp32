name: pr-policy

# This workflow is the required PR review-policy trust boundary. pull_request_target loads this
# workflow from the protected base branch, so it must remain data-only: never check out, source, or
# execute the pull-request tree here. Mechanical tests and compile-only builds run separately under
# the ordinary pull_request event in build.yml.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Keep this job named `gates`: branch protection requires that check alongside `build`.
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out trusted base policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .trusted-policy
          fetch-depth: 1
          persist-credentials: false

      - name: Enforce current PR review evidence from trusted base
        working-directory: .trusted-policy
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$PR_NUMBER" in ''|*[!0-9]*) echo "agent policy: missing PR number" >&2; exit 2 ;; esac
          printf '%s' "$EVENT_HEAD_SHA" | grep -Eq '^[0-9a-fA-F]{40}$' \
            || { echo "agent policy: missing or malformed event head SHA" >&2; exit 2; }
          printf '%s' "$EVENT_BASE_SHA" | grep -Eq '^[0-9a-fA-F]{40}$' \
            || { echo "agent policy: missing or malformed event base SHA" >&2; exit 2; }

          policy_tmp="$(mktemp -d)"
          trap 'rm -rf "$policy_tmp"' EXIT
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$policy_tmp/pr.json"
          current_head="$(jq -r '.head.sha // empty' "$policy_tmp/pr.json")"
          current_base="$(jq -r '.base.sha // empty' "$policy_tmp/pr.json")"
          printf '%s' "$current_head" | grep -Eq '^[0-9a-fA-F]{40}$' \
            || { echo "agent policy: GitHub returned no current PR head SHA" >&2; exit 2; }
          [ "$current_head" = "$EVENT_HEAD_SHA" ] \
            || { echo "agent policy: workflow head $EVENT_HEAD_SHA is stale; current PR head is $current_head" >&2; exit 2; }
          [ "$current_base" = "$EVENT_BASE_SHA" ] \
            || { echo "agent policy: workflow base $EVENT_BASE_SHA is stale; current PR base is $current_base" >&2; exit 2; }

          jq -r '.body // ""' "$policy_tmp/pr.json" > "$policy_tmp/body.md"
          changed_files="$(jq -r '.changed_files // empty' "$policy_tmp/pr.json")"
          case "$changed_files" in ''|*[!0-9]*) echo "agent policy: missing changed_files metadata" >&2; exit 2 ;; esac
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            > "$policy_tmp/file-pages.json"
          python3 tools/agent-policy/extract_changed_files.py \
            "$changed_files" "$policy_tmp/file-pages.json" > "$policy_tmp/files.txt"

          # Exact-commit evidence is needed only for the possible record-free class. Ordinary and
          # fork PRs stay on the human-record path and need no assumption that their head object is
          # addressable through the base repository's commit endpoint.
          renovate_candidate="$(jq -r --arg repo "$GITHUB_REPOSITORY" '
            if .head.repo.full_name == $repo
               and (.head.ref | type == "string" and startswith("renovate/"))
               and .commits == 1
            then "yes" else "no" end
          ' "$policy_tmp/pr.json")"
          if [ "$renovate_candidate" = yes ]; then
            gh api "repos/$GITHUB_REPOSITORY/commits/$current_head" > "$policy_tmp/head-commit.json"
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/commits/$current_head?per_page=100" \
              > "$policy_tmp/head-commit-pages.json"
            AGENT_PR_BODY_FILE="$policy_tmp/body.md" \
            AGENT_PR_HEAD_SHA="$current_head" \
            AGENT_CHANGED_FILES_FILE="$policy_tmp/files.txt" \
            AGENT_PR_METADATA_FILE="$policy_tmp/pr.json" \
            AGENT_PR_HEAD_COMMIT_FILE="$policy_tmp/head-commit.json" \
            AGENT_PR_HEAD_COMMIT_PAGES_FILE="$policy_tmp/head-commit-pages.json" \
              ./scripts/run-agent-policy.sh
          else
            AGENT_PR_BODY_FILE="$policy_tmp/body.md" \
            AGENT_PR_HEAD_SHA="$current_head" \
            AGENT_CHANGED_FILES_FILE="$policy_tmp/files.txt" \
              ./scripts/run-agent-policy.sh
          fi
