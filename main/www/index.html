<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>daikin-altherma-esp32</title>
<style>
/*@@INLINE:style.css@@*/
</style>
</head>
<body>
<div class="app">

  <!-- ═══ HEADER · dashboard (the app is a single screen — no settings/sub-screens) ═══ -->
  <header class="hdr hdr-dash" id="hdrDash">
    <span class="logo md">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="13.5" rx="2.3"/><circle cx="8.6" cy="11.75" r="4.15"/><path d="M8.6 11.75C8.05 9.9 8.15 8.3 8.6 7.75 9.05 8.3 9.15 9.9 8.6 11.75Z"/><path d="M8.6 11.75C8.05 9.9 8.15 8.3 8.6 7.75 9.05 8.3 9.15 9.9 8.6 11.75Z" transform="rotate(120 8.6 11.75)"/><path d="M8.6 11.75C8.05 9.9 8.15 8.3 8.6 7.75 9.05 8.3 9.15 9.9 8.6 11.75Z" transform="rotate(240 8.6 11.75)"/><circle cx="8.6" cy="11.75" r="1.05" fill="currentColor" stroke="none"/><path d="M15 8.4h3.6M15 10.2h3.6M15 12h3.6M15 13.8h3.6M15 15.6h3.6"/><path d="M6.4 18.5V20M17.6 18.5V20"/></svg>
    </span>
    <div class="hdr-id">
      <div class="hdr-name" id="hdrName">daikin-altherma-esp32</div>
    </div>
  </header>

  <main>

    <!-- ═══ DASHBOARD (the only screen) ═══ -->
    <section class="view active" id="viewDash">
      <div class="pad">
        <!-- Crash banner: shown when /status.last_crash is set (a fault reset or a core dump waiting).
             Rendered by renderCrashBanner() from app.js; dismissible per crash signature. -->
        <div class="crash-banner" id="crashBanner" hidden></div>
        <div class="hero">
          <div class="hero-kicker"><span class="hero-dot" id="heroDot"></span><span id="heroKicker">—</span></div>
          <div class="hero-mode" id="heroMode">—</div>
          <div class="hero-sub" id="heroSub"></div>
        </div>
        <div id="valueGroups"></div>
      </div>
    </section>

  </main>

  <!-- ═══ MQTT edit modal (opened from the dashboard MQTT card pencil) ═══ -->
  <div class="modal" id="mqttModal" hidden>
    <div class="modal-backdrop" id="mqttBackdrop"></div>
    <form class="modal-card" id="mqttForm" role="dialog" aria-modal="true" aria-labelledby="mqttModalTitle">
      <div class="section-label card-title" id="mqttModalTitle">MQTT broker</div>
      <label class="field">
        <span class="field-label plain">Host : port</span>
        <input class="input" name="broker" id="mqBroker" placeholder="192.168.1.10:1883" autocomplete="off">
      </label>
      <p class="hint err" id="mqError" hidden>Enter host:port — e.g. 192.168.1.10:1883 — or mqtts://host:8883 for TLS</p>
      <label class="field">
        <span class="field-label plain">Username · optional</span>
        <input class="input" name="user" id="mqUser" placeholder="mqtt" autocomplete="off">
      </label>
      <label class="field">
        <span class="field-label plain">Password · optional</span>
        <input class="input" name="pass" id="mqPass" type="password" placeholder="••••••••" autocomplete="off">
      </label>
      <p class="hint">Credentials require a TLS broker — use an mqtts:// URL (e.g. mqtts://host:8883). Empty host disables MQTT.</p>
      <div class="modal-actions">
        <button class="btn secondary" type="button" id="mqCancel">Cancel</button>
        <button class="btn primary" type="submit" id="mqBtn">Save</button>
      </div>
    </form>
  </div>

  <div class="toasts" id="toasts"></div>
</div>

<script>
//@@INLINE:app.js@@
</script>
</body>
</html>
