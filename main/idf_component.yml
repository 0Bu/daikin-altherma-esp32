dependencies:
  idf: ">=5.5"
  # mDNS so the device is reachable at http://daikin-altherma-esp32.local (see main.cpp).
  espressif/mdns: "^1.2.0"
  # cJSON: the bundled `json` component was removed from ESP-IDF core in v6.0, so it is pulled
  # as a managed component (used by http_config.cpp). Also resolves on 5.x.
  espressif/cjson: "^1.7.19"
  # esp-mqtt: the bundled `mqtt` component was likewise extracted from ESP-IDF core in v6.0, so it
  # is pulled as a managed component (used by mqtt_ha.cpp). Provides the `mqtt` component that
  # main/CMakeLists.txt REQUIRES. Also resolves on 5.x.
  espressif/mqtt: "^1.0.0"
  # led_strip: the WS2812 back-end of the runtime-selectable status indicator (status_led.cpp).
  # An addressable pixel encodes its colour in RMT pulse timings, so unlike a plain GPIO LED it
  # cannot be driven with gpio_set_level — this component is what makes the M5Stack AtomS3 Lite's
  # onboard RGB LED usable from the same image that drives the XIAO's plain one.
  espressif/led_strip: "^3.0.0"
